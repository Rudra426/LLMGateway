<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask a question</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonts: Geist / Inter and JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            brand: {
              emerald: '#10b981',
              'emerald-hover': '#059669',
              'emerald-glow': 'rgba(16, 185, 129, 0.15)',
            },
            surface: {
              DEFAULT: '#0f131c',
              dim: '#0a0e17',
              card: '#141824',
              subtle: '#181d2c',
              border: '#23293b',
              'border-subtle': '#1c2233',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0a0e17;
      color: #e2e8f0;
      font-family: 'Geist', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 2rem 1rem;
    }
    .mono-val {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-[#0a0e17] text-[#e2e8f0] antialiased selection:bg-[#10b981]/20 selection:text-[#10b981]">

  <!-- Main Container: Centered Card exactly ~720px wide -->
  <main class="w-full max-w-[720px] bg-[#141824] border border-[#23293b] rounded-xl p-8 shadow-2xl shadow-black/60 transition-all">
    
    <!-- 1. Header with Title and Provider Toggle -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
      <h1 class="text-2xl font-semibold tracking-tight text-slate-100 font-sans">
        Ask a question
      </h1>

      <!-- Provider Selector -->
      <div class="inline-flex items-center p-1 bg-[#0f131c] border border-[#23293b] rounded-lg self-start sm:self-auto shadow-inner">
        <button
          type="button"
          id="provider-mock-btn"
          onclick="selectProvider('mock')"
          class="px-3 py-1.5 text-xs font-mono font-medium rounded-md transition-all text-emerald-400 bg-[#1e2538] border border-emerald-500/30 shadow-sm cursor-pointer"
        >
          Mock LLM <span class="text-[11px] opacity-75">(mock-model)</span>
        </button>
        <button
          type="button"
          id="provider-gemini-btn"
          onclick="selectProvider('gemini')"
          class="px-3 py-1.5 text-xs font-mono font-medium rounded-md transition-all text-slate-400 hover:text-slate-200 border border-transparent cursor-pointer"
        >
          Google Gemini <span class="text-[11px] opacity-75">(gemini-3.5-flash-lite)</span>
        </button>
      </div>
    </div>

    <!-- Form Container -->
    <form id="question-form" onsubmit="event.preventDefault(); handleSubmit();" class="flex flex-col space-y-4">
      
      <!-- 2. Text area labeled "Question" with placeholder "Type your question" -->
      <div class="flex flex-col space-y-2">
        <label for="question-input" class="text-xs font-medium font-mono uppercase tracking-wider text-slate-400">
          Question
        </label>
        <textarea
          id="question-input"
          rows="4"
          placeholder="Type your question"
          class="w-full rounded-lg bg-[#0f131c] border border-[#23293b] px-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-[#10b981] focus:ring-1 focus:ring-[#10b981] transition-all resize-y font-sans leading-relaxed"
        ></textarea>
      </div>

      <!-- Error State -->
      <div id="error-message" class="hidden flex items-start gap-2.5 px-3.5 py-2.5 rounded-lg bg-red-950/40 border border-red-500/30 text-red-400 text-xs font-sans">
        <svg class="w-4 h-4 text-red-400 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke="currentColor"/>
          <line x1="12" y1="8" x2="12" y2="12" stroke="currentColor"/>
          <line x1="12" y1="16" x2="12.01" y2="16" stroke="currentColor"/>
        </svg>
        <div id="error-text" class="flex-1 leading-relaxed">
          <span class="font-medium">Error:</span> Something went wrong.
        </div>
      </div>

      <!-- 3. Primary button labeled "Ask" / Loading state with spinner -->
      <div class="pt-1">
        <button
          type="submit"
          id="ask-button"
          class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg text-sm font-medium font-sans bg-[#10b981] text-slate-950 hover:bg-[#059669] active:bg-[#047857] transition-all focus:outline-none focus:ring-2 focus:ring-[#10b981]/50 disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer"
        >
          <!-- Normal State Text -->
          <span id="btn-text">Ask</span>

          <!-- Loading Spinner (shown during loading state) -->
          <span id="btn-spinner" class="hidden inline-flex items-center gap-2">
            <svg class="animate-spin h-4 w-4 text-slate-950" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Processing...</span>
          </span>
        </button>
      </div>
    </form>

    <!-- 4. Result card -->
    <div id="result-card" class="hidden mt-6 pt-6 border-t border-[#23293b] flex flex-col space-y-5">
      
      <!-- Answer Text -->
      <div id="answer-text" class="text-sm text-slate-300 leading-relaxed font-sans bg-[#0f131c] border border-[#23293b] rounded-lg p-4 whitespace-pre-wrap">
      </div>

      <!-- Under it: Three small labeled values side by side -->
      <div class="grid grid-cols-3 gap-3">
        <div class="bg-[#0f131c] border border-[#23293b] rounded-lg p-3 flex flex-col justify-between">
          <span class="text-[11px] font-mono uppercase tracking-wider text-slate-400">Source</span>
          <span id="val-source" class="text-sm font-mono font-medium text-emerald-400 mt-1">Cache</span>
        </div>

        <div class="bg-[#0f131c] border border-[#23293b] rounded-lg p-3 flex flex-col justify-between">
          <span class="text-[11px] font-mono uppercase tracking-wider text-slate-400">Cost (INR)</span>
          <span id="val-cost" class="text-sm font-mono font-medium text-slate-200 mt-1">₹0.00</span>
        </div>

        <div class="bg-[#0f131c] border border-[#23293b] rounded-lg p-3 flex flex-col justify-between">
          <span class="text-[11px] font-mono uppercase tracking-wider text-slate-400">Latency (ms)</span>
          <span id="val-latency" class="text-sm font-mono font-medium text-cyan-400 mt-1">14ms</span>
        </div>
      </div>

    </div>

  </main>

  <script>
    const questionInput = document.getElementById('question-input');
    const askButton = document.getElementById('ask-button');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorMessage = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    const resultCard = document.getElementById('result-card');
    
    const valSource = document.getElementById('val-source');
    const valCost = document.getElementById('val-cost');
    const valLatency = document.getElementById('val-latency');
    const answerText = document.getElementById('answer-text');

    let selectedProvider = 'mock';

    function selectProvider(prov) {
      selectedProvider = prov;
      const mockBtn = document.getElementById('provider-mock-btn');
      const geminiBtn = document.getElementById('provider-gemini-btn');
      const activeClass = 'px-3 py-1.5 text-xs font-mono font-medium rounded-md transition-all text-emerald-400 bg-[#1e2538] border border-emerald-500/30 shadow-sm cursor-pointer';
      const inactiveClass = 'px-3 py-1.5 text-xs font-mono font-medium rounded-md transition-all text-slate-400 hover:text-slate-200 border border-transparent cursor-pointer';

      if (prov === 'mock') {
        mockBtn.className = activeClass;
        geminiBtn.className = inactiveClass;
      } else {
        geminiBtn.className = activeClass;
        mockBtn.className = inactiveClass;
      }
    }

    function setState(state, err = '') {
      if (state === 'success') {
        askButton.disabled = false;
        btnText.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
        errorMessage.classList.add('hidden');
        resultCard.classList.remove('hidden');
      } else if (state === 'loading') {
        askButton.disabled = true;
        btnText.classList.add('hidden');
        btnSpinner.classList.remove('hidden');
        errorMessage.classList.add('hidden');
        resultCard.classList.add('hidden');
      } else if (state === 'error') {
        askButton.disabled = false;
        btnText.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
        errorMessage.classList.remove('hidden');
        errorText.innerHTML = '<span class="font-medium">Error:</span> ' + err;
        resultCard.classList.add('hidden');
      }
    }

    async function handleSubmit() {
      const q = questionInput.value.trim();
      if (!q) return;

      setState('loading');
      
      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: q, provider: selectedProvider })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          setState('error', data.error || 'Unknown error occurred');
          return;
        }
        
        answerText.textContent = data.answer;
        valSource.textContent = data.source;
        if (data.source === 'Cache') {
          valSource.className = 'text-sm font-mono font-medium mt-1 text-emerald-400';
        } else {
          valSource.className = 'text-sm font-mono font-medium mt-1 text-blue-400';
        }
        valCost.textContent = '₹' + data.cost;
        valLatency.textContent = data.latency + 'ms';
        
        setState('success');
      } catch (err) {
        setState('error', err.message);
      }
    }
  </script>
</body>
</html>
